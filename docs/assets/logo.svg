<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="796" height="156" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Icon Section -->
  <g transform="translate(36, 32)">
    <!-- Icon Container -->
    <rect width="96" height="96" rx="22" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="4" y="4" width="88" height="88" rx="18" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5"/>

    <!-- Binlog Stream Lines -->
    <path d="M22 34h52M22 48h36M22 62h46" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Inspection Lens -->
    <circle cx="62" cy="54" r="14" stroke="#38bdf8" stroke-width="4.5" fill="#0b0f17" filter="url(#glow)"/>
    <circle cx="62" cy="54" r="14" stroke="#38bdf8" stroke-width="4.5" fill="#0b0f17"/>
    <path d="M72 64l12 12" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Internal byte dot inside lens -->
    <circle cx="62" cy="54" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Typography Section -->
  <g transform="translate(156, 42)">
    <!-- Brand Title -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5" fill="url(#textGrad)">binsight</text>

    <!-- Version Badge -->
    <rect x="188" y="16" width="60" height="24" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1"/>
    <text x="218" y="32" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">v0.2.0</text>

    <!-- Subtitle -->
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      See what's really happening inside your MySQL &amp; MariaDB binary logs.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 88)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">
      <text x="0" y="10" fill="#64748b">⚡ Fast SQLite Index</text>
      <circle cx="120" cy="7" r="2" fill="#334155"/>
      <text x="130" y="10" fill="#64748b">🔒 Read-Only &amp; Safe</text>
      <circle cx="238" cy="7" r="2" fill="#334155"/>
      <text x="248" y="10" fill="#64748b">🔍 Forensic Decoders</text>
      <circle cx="362" cy="7" r="2" fill="#334155"/>
      <text x="372" y="10" fill="#64748b">📡 Live Replica Streaming</text>
    </g>
  </g>
</svg>
