<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow" cx="85%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="headlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="cyanTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="lensGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Outer Border Frame -->
  <rect x="16" y="16" width="1168" height="598" rx="24" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- ================= LEFT COLUMN: BRANDING & HEADLINE ================= -->
  <g transform="translate(80, 72)">
    
    <!-- Top Row: Logo Icon & Name -->
    <g transform="translate(0, 0)">
      <!-- Icon Box -->
      <rect width="56" height="56" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="2" y="2" width="52" height="52" rx="12" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1"/>
      <!-- Stream Lines -->
      <path d="M14 20h30M14 28h20M14 36h26" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round"/>
      <!-- Loupe -->
      <circle cx="36" cy="32" r="8" stroke="#38bdf8" stroke-width="2.5" fill="#0b0f17"/>
      <path d="M42 38l6 6" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="36" cy="32" r="2" fill="#38bdf8"/>

      <!-- App Name -->
      <text x="72" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-1" fill="#ffffff">binsight</text>

      <!-- Badge -->
      <rect x="216" y="18" width="92" height="24" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1"/>
      <text x="262" y="34" font-family="'SF Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="middle">v0.2.0 · OSS</text>
    </g>

    <!-- Main Headline -->
    <g transform="translate(0, 110)">
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.5" fill="url(#headlineGrad)">
        See what's really happening
      </text>
      <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.5" fill="url(#cyanTextGrad)">
        inside your binlogs.
      </text>
    </g>

    <!-- Subtitle / Pitch -->
    <g transform="translate(0, 252)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="-0.2">
        A fast, local, read-only MySQL &amp; MariaDB binlog analyzer,
      </text>
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="-0.2">
        forensic decoder, and transaction inspector.
      </text>
    </g>

    <!-- Key Feature Badges Grid -->
    <g transform="translate(0, 324)">
      <!-- Badge 1: SQLite Index -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Fast SQLite Index</text>
      </g>
      <!-- Badge 2: Side-by-side Diff -->
      <g transform="translate(192, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔍 Side-by-Side Diff</text>
      </g>
      <!-- Badge 3: 6 Anomaly Detectors -->
      <g transform="translate(0, 44)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚨 6 Anomaly Detectors</text>
      </g>
      <!-- Badge 4: Replica Streaming -->
      <g transform="translate(192, 44)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📡 Replica Streaming</text>
      </g>
    </g>

    <!-- Bottom URL Bar -->
    <g transform="translate(0, 442)">
      <circle cx="6" cy="6" r="5" fill="#22c55e"/>
      <text x="22" y="11" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#38bdf8">binsight.adrijshikhar.dev</text>
      <text x="248" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">· 100% Read-Only &amp; Zero CGO</text>
    </g>

  </g>

  <!-- ================= RIGHT COLUMN: INTERACTIVE CONSOLE CARD ================= -->
  <g transform="translate(680, 80)" filter="url(#cardShadow)">
    
    <!-- Outer Card Frame -->
    <rect width="440" height="470" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5"/>

    <!-- Terminal Header Bar -->
    <rect width="440" height="42" rx="16" fill="#0f172a" fill-opacity="0.9"/>
    <!-- Clip bottom corners of header -->
    <rect y="26" width="440" height="16" fill="#0f172a" fill-opacity="0.9"/>
    <line x1="0" y1="42" x2="440" y2="42" stroke="#1e293b" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="20" cy="21" r="5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="36" cy="21" r="5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="52" cy="21" r="5" fill="#10b981" fill-opacity="0.8"/>

    <!-- Active Binlog File Title -->
    <text x="220" y="26" font-family="'SF Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">mysql-bin.000124 (52.1 MB)</text>
    <rect x="376" y="13" width="46" height="18" rx="4" fill="#059669" fill-opacity="0.2"/>
    <text x="399" y="26" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">LIVE</text>

    <!-- Event Rows Inside Card -->
    <g transform="translate(18, 56)" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11">
      
      <!-- Event 1: GTID -->
      <g transform="translate(0, 0)">
        <rect width="404" height="32" rx="6" fill="#1e293b" fill-opacity="0.3"/>
        <text x="10" y="20" fill="#64748b">00:14:02</text>
        <rect x="76" y="7" width="48" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="100" y="20" fill="#60a5fa" font-weight="700" text-anchor="middle">GTID</text>
        <text x="136" y="20" fill="#cbd5e1">5c922df7-5f83-11f1:1</text>
      </g>

      <!-- Event 2: BEGIN -->
      <g transform="translate(0, 38)">
        <rect width="404" height="32" rx="6" fill="#1e293b" fill-opacity="0.3"/>
        <text x="10" y="20" fill="#64748b">00:14:02</text>
        <rect x="76" y="7" width="48" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.2"/>
        <text x="100" y="20" fill="#a78bfa" font-weight="700" text-anchor="middle">QUERY</text>
        <text x="136" y="20" fill="#94a3b8">BEGIN TRANSACTION</text>
      </g>

      <!-- Event 3: TABLE_MAP -->
      <g transform="translate(0, 76)">
        <rect width="404" height="32" rx="6" fill="#1e293b" fill-opacity="0.3"/>
        <text x="10" y="20" fill="#64748b">00:14:03</text>
        <rect x="76" y="7" width="58" height="18" rx="4" fill="#64748b" fill-opacity="0.2"/>
        <text x="105" y="20" fill="#94a3b8" font-weight="700" text-anchor="middle">MAP</text>
        <text x="146" y="20" fill="#cbd5e1">shop.orders (table_id: 108)</text>
      </g>

      <!-- Event 4: WRITE_ROWS_V2 -->
      <g transform="translate(0, 114)">
        <rect width="404" height="32" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1"/>
        <text x="10" y="20" fill="#64748b">00:14:03</text>
        <rect x="76" y="7" width="82" height="18" rx="4" fill="#0284c7" fill-opacity="0.3"/>
        <text x="117" y="20" fill="#38bdf8" font-weight="700" text-anchor="middle">WRITE_ROWS</text>
        <text x="170" y="20" fill="#38bdf8" font-weight="600">+1,420 rows</text>
      </g>

      <!-- Event 5: UPDATE_ROWS_V2 -->
      <g transform="translate(0, 152)">
        <rect width="404" height="32" rx="6" fill="#1e293b" fill-opacity="0.3"/>
        <text x="10" y="20" fill="#64748b">00:14:04</text>
        <rect x="76" y="7" width="82" height="18" rx="4" fill="#eab308" fill-opacity="0.2"/>
        <text x="117" y="20" fill="#facc15" font-weight="700" text-anchor="middle">UPDATE_ROWS</text>
        <text x="170" y="20" fill="#cbd5e1">+2 rows</text>
      </g>

      <!-- Event 6: XID (COMMIT) -->
      <g transform="translate(0, 190)">
        <rect width="404" height="32" rx="6" fill="#1e293b" fill-opacity="0.3"/>
        <text x="10" y="20" fill="#64748b">00:14:05</text>
        <rect x="76" y="7" width="48" height="18" rx="4" fill="#10b981" fill-opacity="0.2"/>
        <text x="100" y="20" fill="#34d399" font-weight="700" text-anchor="middle">XID</text>
        <text x="136" y="20" fill="#cbd5e1">COMMIT (xid: 849201)</text>
      </g>

    </g>

    <!-- Floating Highlight Card 1: Anomaly Alert Banner -->
    <g transform="translate(18, 296)">
      <rect width="404" height="52" rx="10" fill="#451a03" fill-opacity="0.75" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.5"/>
      <!-- Alert Icon -->
      <circle cx="28" cy="26" r="12" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="28" y="31" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" text-anchor="middle">⚠</text>
      <!-- Text -->
      <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24">ANOMALY DETECTED: HUGE TRANSACTION</text>
      <text x="50" y="38" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="500" fill="#d97706">54.2 MiB (Threshold 50 MiB) · Risk of replication lag</text>
    </g>

    <!-- Floating Highlight Card 2: Decoder Diff Verified -->
    <g transform="translate(18, 360)">
      <rect width="404" height="50" rx="10" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
      <!-- Check Icon -->
      <circle cx="28" cy="25" r="12" fill="#10b981" fill-opacity="0.2"/>
      <text x="28" y="30" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">✓</text>
      <!-- Text -->
      <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">DUAL DECODER DIFF VERIFIED</text>
      <text x="50" y="37" font-family="'SF Mono', Menlo, monospace" font-size="10.5" font-weight="500" fill="#6ee7b7">go-mysql ↔ mysqlbinlog: 0 divergence (100% match)</text>
    </g>

    <!-- Card Footer Status -->
    <g transform="translate(24, 432)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
      <text x="18" y="10" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#94a3b8">SQLite Index: 1,429,082 events indexed in 1.4s</text>
    </g>

  </g>

</svg>
