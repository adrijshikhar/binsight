name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to release if triggering manually'
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: Release Please (PR & Tag)
    runs-on: ubuntu-latest
    if: github.repository == 'adrijshikhar/binsight'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    needs: release-please
    if: |
      github.repository == 'adrijshikhar/binsight' &&
      (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch')
    outputs:
      tag: ${{ steps.target.outputs.ref }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - name: Determine Target Git Ref
        id: target
        run: |
          if [ -n "${{ needs.release-please.outputs.tag_name }}" ]; then
            TAG="${{ needs.release-please.outputs.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          echo "ref=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Setup Bun (Web UI)
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  verify-asset:
    name: Verify Release Assets & Smoke Test
    needs: goreleaser
    runs-on: macos-latest
    outputs:
      tag: ${{ needs.goreleaser.outputs.tag }}
      version: ${{ needs.goreleaser.outputs.version }}
      sha_darwin_arm64: ${{ steps.checksum.outputs.sha_darwin_arm64 }}
      sha_darwin_amd64: ${{ steps.checksum.outputs.sha_darwin_amd64 }}
      sha_linux_arm64: ${{ steps.checksum.outputs.sha_linux_arm64 }}
      sha_linux_amd64: ${{ steps.checksum.outputs.sha_linux_amd64 }}
    steps:
      - name: Download & Verify Release Checksums
        id: checksum
        run: |
          TAG="${{ needs.goreleaser.outputs.tag }}"
          VERSION="${{ needs.goreleaser.outputs.version }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          CHECKSUMS_URL="${BASE_URL}/checksums.txt"

          echo "Checking release assets availability at: $CHECKSUMS_URL"
          FOUND=false
          for i in {1..15}; do
            HTTP_CODE=$(curl -sL -w "%{http_code}" -o checksums.txt "$CHECKSUMS_URL" || true)
            if [ "$HTTP_CODE" = "200" ] && [ -s checksums.txt ]; then
              echo "Release assets live and checksums.txt successfully retrieved!"
              FOUND=true
              break
            fi
            echo "Attempt $i/15: waiting for release assets to propagate (HTTP $HTTP_CODE)..."
            sleep 5
          done

          if [ "$FOUND" = "false" ]; then
            echo "Error: Release assets failed to become available after 75s" >&2
            exit 1
          fi

          PLATFORMS=("darwin_arm64" "darwin_amd64" "linux_arm64" "linux_amd64")
          for PLATFORM in "${PLATFORMS[@]}"; do
            ARCHIVE="binsight_${VERSION}_${PLATFORM}.tar.gz"
            echo "Downloading and verifying $ARCHIVE..."
            curl -fSL -o "$ARCHIVE" "${BASE_URL}/${ARCHIVE}"

            COMPUTED_SHA=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')
            EXPECTED_SHA=$(grep "$ARCHIVE" checksums.txt | awk '{print $1}')

            if [ -z "$EXPECTED_SHA" ]; then
              echo "Error: No checksum found in checksums.txt for $ARCHIVE" >&2
              exit 1
            fi

            if [ "$COMPUTED_SHA" != "$EXPECTED_SHA" ]; then
              echo "Error: Checksum mismatch for $ARCHIVE!" >&2
              echo "  Computed: $COMPUTED_SHA" >&2
              echo "  Expected: $EXPECTED_SHA" >&2
              exit 1
            fi

            echo "✓ Verified $ARCHIVE ($COMPUTED_SHA)"
            echo "sha_${PLATFORM}=$COMPUTED_SHA" >> "$GITHUB_OUTPUT"
          done

      - name: Run Binary Smoke Test Probe
        run: |
          VERSION="${{ needs.goreleaser.outputs.version }}"
          RUNNER_ARCH="$(uname -m)"
          if [ "$RUNNER_ARCH" = "arm64" ]; then
            tar -xzf "binsight_${VERSION}_darwin_arm64.tar.gz" binsight
          else
            tar -xzf "binsight_${VERSION}_darwin_amd64.tar.gz" binsight
          fi

          chmod +x ./binsight
          PROBE_VERSION=$(./binsight version)
          echo "Probe version output: $PROBE_VERSION"

          if [[ "$PROBE_VERSION" != *"binsight ${VERSION}"* ]]; then
            echo "Error: Pre-flight smoke test failed. Expected version ${VERSION}, got: $PROBE_VERSION" >&2
            exit 1
          fi
          echo "✓ Binary probe verification PASSED: $PROBE_VERSION"

  publish-homebrew:
    name: Gated Homebrew Tap Release & Audit
    needs: verify-asset
    runs-on: macos-latest
    environment: release # Maintainer Approval Gate
    steps:
      - name: Checkout Homebrew Tap
        uses: actions/checkout@v7
        with:
          repository: 'adrijshikhar/homebrew-tap'
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update Cask Definition
        run: |
          VERSION="${{ needs.verify-asset.outputs.version }}"
          SHA_DARWIN_ARM64="${{ needs.verify-asset.outputs.sha_darwin_arm64 }}"
          SHA_DARWIN_AMD64="${{ needs.verify-asset.outputs.sha_darwin_amd64 }}"
          SHA_LINUX_ARM64="${{ needs.verify-asset.outputs.sha_linux_arm64 }}"
          SHA_LINUX_AMD64="${{ needs.verify-asset.outputs.sha_linux_amd64 }}"

          CASK_PATH="tap/Casks/binsight.rb"
          mkdir -p tap/Casks

          cat << EOF > "$CASK_PATH"
          # This file was generated by the owner-gated release pipeline.
          cask "binsight" do
            version "${VERSION}"

            on_macos do
              on_arm do
                sha256 "${SHA_DARWIN_ARM64}"
                url "https://github.com/adrijshikhar/binsight/releases/download/v#{version}/binsight_#{version}_darwin_arm64.tar.gz"
              end
              on_intel do
                sha256 "${SHA_DARWIN_AMD64}"
                url "https://github.com/adrijshikhar/binsight/releases/download/v#{version}/binsight_#{version}_darwin_amd64.tar.gz"
              end
            end
            on_linux do
              on_arm do
                sha256 "${SHA_LINUX_ARM64}"
                url "https://github.com/adrijshikhar/binsight/releases/download/v#{version}/binsight_#{version}_linux_arm64.tar.gz"
              end
              on_intel do
                sha256 "${SHA_LINUX_AMD64}"
                url "https://github.com/adrijshikhar/binsight/releases/download/v#{version}/binsight_#{version}_linux_amd64.tar.gz"
              end
            end

            name "binsight"
            desc "A local MySQL & MariaDB binlog viewer and analyzer for developers"
            homepage "https://github.com/adrijshikhar/binsight"

            livecheck do
              skip "Auto-generated on release."
            end

            binary "binsight"
          end
          EOF

          git -C tap diff Casks/binsight.rb

      - name: Run Brew Audit
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew tap adrijshikhar/tap "$PWD/tap" --force 2>/dev/null || true
          brew audit --cask --strict --online adrijshikhar/tap/binsight
          brew developer off 2>/dev/null || true

      - name: Test Brew Install
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew install --cask --force adrijshikhar/tap/binsight
          binsight version

      - name: Commit and Push to Tap
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/binsight.rb
          if git diff --cached --quiet; then
            echo "No changes detected in tap definition, skipping push."
          else
            git commit -m "feat(binsight): update to ${{ needs.verify-asset.outputs.version }} (verified & audited)"
            git push origin main
          fi

  publish-docker:
    name: Gated Multi-Arch Docker Build & Push
    needs: verify-asset
    runs-on: ubuntu-latest
    environment: release # Maintainer Approval Gate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-asset.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/adrijshikhar/binsight
          tags: |
            type=raw,value=${{ needs.verify-asset.outputs.version }}
            type=raw,value=latest

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ needs.verify-asset.outputs.version }}
