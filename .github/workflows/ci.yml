# .github/workflows/ci.yml
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with: { go-version: "1.26" }
      - run: make ui
      - run: go test -race ./...
      - run: cd web && bun install && bun run test
